name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --locked

      - name: Embed executable icon
        shell: pwsh
        run: .\scripts\embed-windows-icon.ps1

      - name: Smoke test release binary
        shell: pwsh
        run: .\target\release\fastxcel.exe --smoke-test

      - name: Package executable
        shell: pwsh
        run: |
          $exe = "target\release\fastxcel.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe dist\fastxcel.exe

      - name: Build Windows installer
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\fastxcel.iss

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            $hash | Set-Content "$($_.FullName).sha256" -NoNewline
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fastxcel-windows
          path: dist/*

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist -File | Select-Object -ExpandProperty FullName
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes
          }
