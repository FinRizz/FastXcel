[package]
name = "fastxcel"
version = "0.1.0"
edition = "2021"
authors = ["Ayush Tripathi"]
description = "A blazing fast viewer for large datasets"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[dependencies]
# GUI
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["default", "image"] }
# Native file picker (Windows-friendly)
rfd = "0.14"
# Data engine (blazing fast)
polars = { version = "0.43.1", default-features = false, features = ["lazy", "csv", "parquet"] }
# Time & logging
chrono = { version = "0.4", features = ["clock"] }
log = "0.4"
env_logger = "0.11"