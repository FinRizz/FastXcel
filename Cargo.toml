[package]
name = "fastxcel"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = ["Ayush Tripathi"]
description = "A blazing fast viewer for large datasets"
build = "build.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[dependencies]
# GUI
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["default", "image"] }
# Native file picker (Windows-friendly)
rfd = "0.14"
# Data engine (blazing fast)
# Preserve all supported file types. Format timezones in the UI because Polars
# 0.43's timezone validator rejects fractional-hour offsets such as +05:30.
polars = { version = "0.43.1", default-features = false, features = ["lazy", "csv", "parquet", "dtype-full"] }
# Time & logging
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.8.6"
# Polars 0.43 categorical builders require hashbrown's raw-table API.
hashbrown = { version = "0.14", features = ["raw"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
